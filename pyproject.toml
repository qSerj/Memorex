[project]
name = "memorex"
version = "0.2.0"
description = "A local LLM-administered knowledge Wiki and provenance compiler prototype"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116",
    "jinja2>=3.1",
    "openai>=1.0",
    "pydantic>=2.10",
    "python-multipart>=0.0.20",
    "typer>=0.15",
    "uvicorn>=0.35",
]

[project.scripts]
memorex = "memorex.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.12",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memorex"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
